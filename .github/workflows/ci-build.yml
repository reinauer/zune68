name: Zune68 CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v16.2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Select the toolchain's 68000 harness environment
        shell: bash
        run: |
          set -euo pipefail
          python=/opt/amiga/libexec/amitools/bin/python
          test -x "$python"
          "$python" -c 'import amitools, machine68k'
          echo "PYTHON=$python" >> "$GITHUB_ENV"
          m68k-amigaos-gcc --version
          command -v flexcat lha sfdc fd2sfd

      - name: Build and check the full 68000 distribution
        run: make -j2 check release

      - name: Check the diagnostic core
        run: make -j2 check-core TRACE=1 BUILD="$RUNNER_TEMP/zune68-trace"

      - name: Check incremental build
        run: make -j2 all

      - name: Check release tag and prepare Aminet pair
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/prepare_aminet.py --tag "$RELEASE_TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: zune68-release
          path: |
            build/muimaster/release/*.lha
            build/muimaster/release/*.readme
          if-no-files-found: error

      - name: Build the version 21 development distribution
        if: github.ref_name == 'mui5-dev' || github.head_ref == 'mui5-dev'
        run: make -j2 check release MUI5_TEST=1 BUILD="$RUNNER_TEMP/zune68-mui5"

      - name: Upload the MUI 5 development distribution
        if: github.ref_name == 'mui5-dev' || github.head_ref == 'mui5-dev'
        uses: actions/upload-artifact@v7
        with:
          name: zune68-mui5-dev
          path: |
            ${{ runner.temp }}/zune68-mui5/release/*.lha
            ${{ runner.temp }}/zune68-mui5/release/*.readme
          if-no-files-found: error
